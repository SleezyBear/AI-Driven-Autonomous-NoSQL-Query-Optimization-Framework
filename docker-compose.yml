services:
  postgres:
    image: pgvector/pgvector:pg17
    platform: linux/amd64
    profiles: ["light", "replica-test", "paper"]
    environment:
      POSTGRES_DB: control_plane
      POSTGRES_USER: control_plane
      POSTGRES_PASSWORD: control_plane_dev_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U control_plane -d control_plane"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-monitored:
    image: mongo:8.0
    platform: linux/amd64
    profiles: ["light"]
    command: ["mongod", "--replSet", "rs-monitored", "--bind_ip_all"]
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping: 1}).ok' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-evaluation:
    image: mongo:8.0
    platform: linux/amd64
    profiles: ["light", "replica-test"]
    command: ["mongod", "--replSet", "rs-evaluation", "--bind_ip_all"]
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping: 1}).ok' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-monitored-init:
    image: mongo:8.0
    platform: linux/amd64
    profiles: ["light"]
    depends_on:
      mongo-monitored:
        condition: service_healthy
    volumes:
      - ./infra/mongo/init-replica-set.sh:/init-replica-set.sh:ro
    entrypoint: ["/bin/sh", "/init-replica-set.sh", "mongo-monitored", "rs-monitored"]

  mongo-evaluation-init:
    image: mongo:8.0
    platform: linux/amd64
    profiles: ["light", "replica-test"]
    depends_on:
      mongo-evaluation:
        condition: service_healthy
    volumes:
      - ./infra/mongo/init-replica-set.sh:/init-replica-set.sh:ro
    entrypoint: ["/bin/sh", "/init-replica-set.sh", "mongo-evaluation", "rs-evaluation"]

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    platform: linux/amd64
    profiles: ["light", "replica-test", "paper"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; assert urlopen('http://localhost:8000/health/ready').status == 200\""]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: backend/worker.Dockerfile
    platform: linux/amd64
    profiles: ["light", "replica-test", "paper"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import sys; sys.exit(0)' "]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    platform: linux/amd64
    profiles: ["light", "replica-test", "paper"]
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost/"]
      interval: 5s
      timeout: 5s
      retries: 20

