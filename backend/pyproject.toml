[project]
name = "autonomous-nosql-optimizer-backend"
version = "0.1.0"
requires-python = ">=3.10,<3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["app"]

[tool.ruff]
target-version = "py310"
line-length = 100
